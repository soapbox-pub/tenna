apply plugin: 'com.android.application'

// Release signing material, written by .ngit/act/workflows/release.yml from
// the ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD secrets and
// deleted again in the same job. Absent in a normal checkout, which is why
// every read of it is guarded: `assembleDebug` and the emulator must keep
// working without it, and only `assembleRelease` needs it to exist.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "pub.soapbox.tenna"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pub.soapbox.tenna"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // -PapkAbis=armeabi-v7a,arm64-v8a trims the packaged ABIs, and the
        // release workflow passes exactly that. libsecp256k1-jni.so is ~2.5 MB
        // per ABI and this is a universal APK, so without it every download
        // carries four copies of it — including the x86 pair, which is
        // emulators and a handful of Chromebooks. Debug builds pass nothing and
        // get all four, so an emulator can still run one.
        def apkAbis = project.findProperty("apkAbis")
        if (apkAbis) {
            ndk {
                abiFilters.clear()
                abiFilters.addAll(apkAbis.toString().split(",").collect { it.trim() }.findAll { it })
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            // The android.jar a unit test compiles against is all stubs, and
            // every one of them throws. That is a sensible default for code
            // that ought to be tested on a device, and the wrong one for a
            // plain function that happens to log — `android.util.Log` alone
            // would put the one thing worth pinning out of reach.
            returnDefaultValues = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // NsiteShortcutsPlugin: ShortcutManagerCompat and IconCompat. Reachable
    // through appcompat today, but named here because this module uses it
    // directly and shouldn't depend on someone else's transitive scope.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    // NsiteWebViewPlugin: the activity-result launcher a site's file chooser
    // is started through. Reachable through appcompat, but named here for the
    // same reason core is.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // NsiteWebViewPlugin: addDocumentStartJavaScript + addWebMessageListener.
    // Capacitor depends on this too, but only as `implementation`, so it
    // doesn't reach this module's compile classpath.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // NappPushService: the WebSocket client that keeps relays open.
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // NostrCrypto: ACINQ's JNI bindings over libsecp256k1, the audited C
    // library Bitcoin Core uses — and Amber and Amethyst, through these same
    // bindings. BIP-340 Schnorr signing and the ECDH both encryption NIPs
    // start from. The curve arithmetic under a user's key is not something to
    // write, and this is what everyone else's signer is standing on.
    //
    // The -android artifact carries the .so per ABI; the -jvm one carries a
    // host-loadable native so NostrCryptoTest can exercise the real thing in a
    // plain JVM unit test rather than only on a device.
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-android:$secp256k1Version"
    testImplementation "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:$secp256k1Version"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // A real org.json for the JVM. Android bundles one, but the stub the unit
    // test classpath gets throws "not mocked" from every method — and an event
    // is a JSONObject all the way down, so NostrCryptoTest could not run a
    // single line of the thing it exists to pin.
    testImplementation "org.json:json:$jsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
