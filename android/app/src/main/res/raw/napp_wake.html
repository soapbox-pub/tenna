<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>napp</title>
</head>
<body>
<script>
/*
 * Tenna's wake page, loaded at a site's origin in a WebView with no window.
 *
 * Nothing native can start a service worker; only a document at its origin
 * can, by posting to it. This page relays in both directions: an event from
 * the host goes to the worker as the message the shim turns into a real one —
 * a `push`, or a `notificationclick` the user just caused — and the shim's
 * reply, once every waitUntil has settled, comes back the same way.
 *
 * The message from the host carries a MessagePort, and carrying it is the
 * other half of what this page is for: a port arrives at a frame and only a
 * frame can transfer it into a worker. It goes across with the event, so a
 * site's handler has somewhere to ask from its first line — and the page can
 * be torn down immediately afterwards, because the port outlives the document
 * that handed it over.
 *
 * The host object `nappHost` exists only in the WebView the push service made;
 * anywhere else this page does nothing.
 */
(function () {
  'use strict';
  var host = window.nappHost;
  if (!host) return;

  function send(m) { host.postMessage(JSON.stringify(m)); }

  function worker() {
    if (!navigator.serviceWorker) return Promise.resolve(null);
    return navigator.serviceWorker.getRegistrations().then(function (regs) {
      for (var i = 0; i < regs.length; i++) { if (regs[i].active) return regs[i].active; }
      if (regs.length === 0) return null;
      return Promise.race([
        navigator.serviceWorker.ready.then(function (r) { return r.active; }),
        new Promise(function (r) { setTimeout(function () { r(null); }, 10000); })
      ]);
    }).catch(function () { return null; });
  }

  if (navigator.serviceWorker) {
    navigator.serviceWorker.addEventListener('message', function (e) {
      var m = e.data;
      if (m && m.__napp === 'done') send({ type: 'done', id: m.id, delivered: true });
    });
  }

  window.addEventListener('message', function (e) {
    var m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (!m || m.type !== 'deliver') return;

    var ports = e.ports && e.ports.length ? [e.ports[0]] : [];

    worker().then(function (w) {
      if (!w) { send({ type: 'done', id: m.id, delivered: false }); return; }
      // `__napp` names the event. A worker still running an older shim knows
      // only 'push' and ignores the rest, which costs it a tap and nothing
      // more; the host's own timeout is what moves that one along.
      w.postMessage({ __napp: m.kind, id: m.id, data: m.data }, ports);
    });
  });

  send({ type: 'ready' });
})();
</script>
</body>
</html>
